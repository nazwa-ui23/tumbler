<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Detail Produk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-header">
        <h1>AZARIYA</h1>
    </header>

    <div id="view-product-detail" class="page-view active">
        <button class="btn-back-nav" onclick="window.location.href='home.html'">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </button>
        <div class="detail-card" id="detail-card-content"></div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let selectedId = localStorage.getItem('selectedProductId');
            if(selectedId) {
                renderProductDetailPage(parseInt(selectedId));
            }
        });
    </script>
</body>
</html>
