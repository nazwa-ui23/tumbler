<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Masuk Email Pembeli</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-step-1" class="auth-overlay active">
        <div class="auth-card">
            <h2>Masuk ke AZARIYA</h2>
            <p>Masukkan email aktif kamu untuk melanjutkan</p>
            <form onsubmit="handleAuthStep1(event)">
                <div class="form-group">
                    <label for="input-email">Alamat Email</label>
                    <input type="email" id="input-email" class="form-input" placeholder="contoh: azariya@email.com" required>
                </div>
                <button type="submit" class="btn-auth">Lanjut <i class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
