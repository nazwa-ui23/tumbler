<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Login Pembeli</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="buyer-login-existing-screen" class="auth-overlay active">
        <div class="auth-card">
            <i class="fas fa-user-check" style="font-size: 2.5rem; color: var(--primary-green); margin-bottom: 10px;"></i>
            <h2>Masuk Akun Pembeli</h2>
            <p>Masukkan Email dan Kata Sandi terdaftar kamu</p>
            <form onsubmit="handleBuyerExistingLogin(event)">
                <div class="form-group">
                    <label for="login-email">Alamat Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="contoh: azariya@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Kata Sandi (Password)</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <p id="buyer-login-error" style="color: #e63946; font-size: 0.8rem; display: none; margin-bottom: 10px;">
                    Email atau Kata Sandi salah / belum terdaftar!
                </p>
                <button type="submit" class="btn-auth">Masuk / Login <i class="fas fa-sign-in-alt"></i></button>
                <button type="button" class="btn-auth" style="background-color: var(--accent-green); margin-top: 8px;" onclick="window.location.href='buyer-auth-step1.html'">
                    <i class="fas fa-arrow-left"></i> Kembali ke Buat Akun
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
