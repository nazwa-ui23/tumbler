<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Login Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="admin-login-screen" class="auth-overlay active">
        <div class="auth-card">
            <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--primary-green); margin-bottom: 10px;"></i>
            <h2>Login Admin</h2>
            <p>Masukkan kata sandi khusus administrator</p>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="admin-username">Nama Pengguna (Username)</label>
                    <input type="text" id="admin-username" class="form-input" placeholder="Masukkan username admin" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Kata Sandi (Password)</label>
                    <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required>
                </div>
                <p id="admin-login-error" style="color: #e63946; font-size: 0.8rem; display: none; margin-bottom: 10px;">
                    Username atau Kata Sandi salah!
                </p>
                <button type="submit" class="btn-auth">Masuk Admin <i class="fas fa-sign-in-alt"></i></button>
                <button type="button" class="btn-auth" style="background-color: var(--accent-green); margin-top: 8px;" onclick="window.location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Kembali
                </button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
