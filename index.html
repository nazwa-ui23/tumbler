<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZARIYA - Pilih Akses Masuk</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="role-selection-screen" class="auth-overlay active">
        <div class="auth-card" style="max-width: 380px; padding: 35px 25px;">
            <i class="fas fa-store" style="font-size: 3.5rem; color: var(--primary-green); margin-bottom: 15px;"></i>
            <h2>Toko AZARIYA</h2>
            <p>Silakan pilih akses masuk aplikasi:</p>

            <button class="admin-big-btn" style="margin: 15px 0 10px 0; font-size: 1rem; padding: 14px;" onclick="window.location.href='buyer-auth-step1.html'">
                <i class="fas fa-shopping-bag"></i> Masuk sebagai Pembeli
            </button>

            <button class="admin-big-btn" style="margin: 5px 0 0 0; font-size: 1rem; padding: 14px; background: linear-gradient(135deg, #34495e, #2c3e50);" onclick="window.location.href='admin-login.html'">
                <i class="fas fa-user-shield"></i> Masuk sebagai Admin
            </button>
        </div>
    </div>
</body>
</html>
